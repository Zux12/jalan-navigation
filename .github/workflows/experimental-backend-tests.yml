name: Experimental diagnostic backend tests
on:
  push:
    branches: [dev/local-routing-integration]
    paths:
      - 'experimental-backend/**'
      - '.github/workflows/experimental-backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test local diagnostic API without credentials
        run: python -m unittest discover -s experimental-backend -p 'test_*.py' -v
