name: JALAN public KL experimental privacy guard
on:
  pull_request:
    paths:
      - 'jalan-kl-3c.js'
      - 'jalan-kl-preview.js'
      - 'jalan-kl-3b.js'
      - 'shared-traffic.js'
      - 'index.html'
      - 'tests/kl3c-privacy.test.js'
      - 'tests/legacy-get-privacy.test.js'
      - '.github/workflows/kl3c-privacy.yml'
  push:
    branches: [main]
    paths:
      - 'jalan-kl-3c.js'
      - 'jalan-kl-preview.js'
      - 'jalan-kl-3b.js'
      - 'shared-traffic.js'
      - 'index.html'
      - 'tests/kl3c-privacy.test.js'
      - 'tests/legacy-get-privacy.test.js'
      - '.github/workflows/kl3c-privacy.yml'
permissions:
  contents: read
jobs:
  client-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check jalan-kl-3c.js && node --check jalan-kl-preview.js && node --check jalan-kl-3b.js && node --check shared-traffic.js
      - run: node --test tests/kl3c-privacy.test.js tests/legacy-get-privacy.test.js
