name: JALAN public non-phone Chromium 390px integration gate
on:
  pull_request:
    paths:
      - 'app.js'
      - 'tomtom-live.js'
      - 'jalan-config.js'
      - 'voice-guidance.js'
      - 'tests/voice-guidance.test.js'
      - 'proactive-routing.js'
      - 'gps-navigation.js'
      - 'predictive-gps.js'
      - 'tests/gps-match-contract.test.js'
      - 'index.html'
      - 'style.css'
      - 'passenger.css'
      - 'passenger-ui.js'
      - 'passenger-home-sheet.js'
      - 'passenger-home-sheet.css'
      - 'passenger-route-sheet.js'
      - 'passenger-route-sheet.css'
      - 'passenger-vector-map.js'
      - 'passenger-route-traffic.js'
      - 'passenger-route-traffic.css'
      - 'tests/passenger-route-traffic.test.js'
      - 'tests/passenger-vector-390.cjs'
      - 'tests/passenger-390.cjs'
      - 'tests/public-desktop-390.cjs'
      - '.github/workflows/public-desktop-gate.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tomtom-live.js'
      - 'jalan-config.js'
      - 'voice-guidance.js'
      - 'tests/voice-guidance.test.js'
      - 'proactive-routing.js'
      - 'gps-navigation.js'
      - 'predictive-gps.js'
      - 'tests/gps-match-contract.test.js'
      - 'index.html'
      - 'style.css'
      - 'passenger.css'
      - 'passenger-ui.js'
      - 'passenger-home-sheet.js'
      - 'passenger-home-sheet.css'
      - 'passenger-route-sheet.js'
      - 'passenger-route-sheet.css'
      - 'passenger-vector-map.js'
      - 'passenger-route-traffic.js'
      - 'passenger-route-traffic.css'
      - 'tests/passenger-route-traffic.test.js'
      - 'tests/passenger-vector-390.cjs'
      - 'tests/passenger-390.cjs'
      - 'tests/public-desktop-390.cjs'
      - '.github/workflows/public-desktop-gate.yml'
permissions:
  contents: read
jobs:
  chromium-public-390:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser and Leaflet dependencies in disposable runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2 leaflet@1.9.4 axe-core@4.10.3 maplibre-gl@5.15.0
          npx playwright install --with-deps chromium
      - name: Run deterministic local Chromium 390px, no outbound network
        run: |
          node --test tests/passenger-route-traffic.test.js tests/voice-guidance.test.js
          node tests/public-desktop-390.cjs
          node tests/passenger-390.cjs
      - name: Verify native vector rendering and public basemap availability
        if: ${{ !cancelled() }}
        run: node tests/passenger-vector-390.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passenger-vector-screenshots
          path: test-artifacts/*.png
