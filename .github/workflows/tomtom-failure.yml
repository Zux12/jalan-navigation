name: JALAN TomTom route revocation and fallback safety
on:
  pull_request:
    paths:
      - 'tomtom-live.js'
      - 'jalan-config.js'
      - 'proactive-routing.js'
      - 'gps-navigation.js'
      - 'predictive-gps.js'
      - 'app.js'
      - 'tests/off-route-reroute.test.js'
      - 'tests/proactive-reroute.test.js'
      - 'tests/gps-match-contract.test.js'
      - 'tests/tomtom-failure.test.js'
      - '.github/workflows/tomtom-failure.yml'
  push:
    branches: [main]
    paths:
      - 'tomtom-live.js'
      - 'jalan-config.js'
      - 'proactive-routing.js'
      - 'gps-navigation.js'
      - 'predictive-gps.js'
      - 'app.js'
      - 'tests/off-route-reroute.test.js'
      - 'tests/proactive-reroute.test.js'
      - 'tests/gps-match-contract.test.js'
      - 'tests/tomtom-failure.test.js'
      - '.github/workflows/tomtom-failure.yml'
permissions:
  contents: read
jobs:
  route-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tomtom-live.js && node --check proactive-routing.js && node --check gps-navigation.js
      - run: node --test tests/tomtom-failure.test.js tests/proactive-reroute.test.js tests/gps-match-contract.test.js tests/off-route-reroute.test.js
